name: Verify Relay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --extra test --python 3.13
      - run: uv run --frozen pytest tests -q --cov=app --cov-report=term-missing
      - run: uv run --frozen python scripts/evaluate.py
      - run: node --check app/static/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-evaluation
          path: artifacts/evaluation.json

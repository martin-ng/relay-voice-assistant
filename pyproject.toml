[project]
name = "relay-voice-assistant"
version = "0.2.0"
description = "Voice-enabled scheduling with durable conversations and transactional bookings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.2,<1",
    "openai>=1.108.0,<2",
    "pydantic>=2.11.9,<3",
    "python-dotenv>=1.1.1,<2",
    "uvicorn>=0.35.0,<1",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.1,<1",
    "pytest>=8.4.2,<9",
    "pytest-cov>=7.0.0,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
